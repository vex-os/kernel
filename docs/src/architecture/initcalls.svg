<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="initcalls-title initcalls-desc">
  <title id="initcalls-title">How an initcall becomes a call</title>
  <desc id="initcalls-desc">A registration macro writes an entry into a linker section. The section name carries the stage and the order. The linker script sorts the sections, brackets them with start and end symbols, and the runner calls every entry.</desc>
  <style>
    :root {
      --fg: #1b2430;
      --muted: #4a5568;
      --note: #2d3748;
      --card: #fbfcfe;
      --card-line: #dbe1ea;
      --box: #f4f7fb;
      --box-line: #c9d2de;
      --accent: #2f6feb;
      --accent-soft: #eaf1ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6e9ef;
        --muted: #aab3c2;
        --note: #c9d1de;
        --card: #1b2029;
        --card-line: #323b49;
        --box: #232a35;
        --box-line: #6b7686;
        --accent: #8ab4ff;
        --accent-soft: #1d2a40;
      }
    }
    .card { fill: var(--card); stroke: var(--card-line); stroke-width: 1; }
    .box { fill: var(--box); stroke: var(--box-line); stroke-width: 1.5; }
    .box-accent { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
    .title { font: 600 22px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--fg); }
    .subtitle { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
    .label { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); letter-spacing: 0.08em; }
    .code { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--fg); }
    .small { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--muted); }
    .note { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--note); }
    .arrow { stroke: var(--accent); stroke-width: 2; fill: none; }
    .head { fill: var(--accent); }
  </style>
  <defs>
    <marker id="initcalls-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="card" x="8" y="8" width="944" height="404" rx="14"/>

  <text class="title" x="40" y="44">How an initcall becomes a call</text>
  <text class="subtitle" x="40" y="68">The section name is the sort key: stage first, then order.</text>

  <rect class="box" x="20" y="95" width="205" height="150" rx="8"/>
  <text class="label" x="36" y="119">SOURCE FILE</text>
  <text class="code" x="36" y="146">initcall_bsp_vfs(</text>
  <text class="code" x="36" y="168">    init_ext2,</text>
  <text class="code" x="36" y="190">    INIT_EARLY);</text>

  <rect class="box" x="255" y="95" width="205" height="150" rx="8"/>
  <text class="label" x="271" y="119">LINKER SECTION</text>
  <text class="code" x="271" y="146">.initcalls.bsp.</text>
  <text class="code" x="271" y="168">3100000.3</text>
  <text class="small" x="271" y="196">3100000 = vfs stage</text>
  <text class="small" x="271" y="214">.3 = INIT_EARLY</text>

  <rect class="box-accent" x="490" y="95" width="205" height="150" rx="8"/>
  <text class="label" x="506" y="119">SORTED TABLE</text>
  <text class="code" x="506" y="146">initcalls_bsp_start</text>
  <text class="code" x="506" y="168">  { init_ext2, ... }</text>
  <text class="code" x="506" y="190">  { ... }</text>
  <text class="code" x="506" y="212">initcalls_bsp_end</text>

  <rect class="box" x="725" y="95" width="215" height="150" rx="8"/>
  <text class="label" x="741" y="119">RUNNER</text>
  <text class="code" x="741" y="146">invoke_initcalls(</text>
  <text class="code" x="741" y="168">  start, end);</text>
  <text class="code" x="741" y="190">for each entry:</text>
  <text class="code" x="741" y="212">  it-&gt;function();</text>

  <line class="arrow" x1="225" y1="170" x2="247" y2="170" marker-end="url(#initcalls-arrow)"/>
  <line class="arrow" x1="460" y1="170" x2="482" y2="170" marker-end="url(#initcalls-arrow)"/>
  <line class="arrow" x1="695" y1="170" x2="717" y2="170" marker-end="url(#initcalls-arrow)"/>

  <text class="note" x="40" y="292">The macro writes a { function, name } entry into the section. The linker script keeps the section and sorts it.</text>
  <text class="note" x="40" y="318">The BSP sections are between initcalls_bsp_start and initcalls_bsp_end. The SMP sections have their own pair.</text>
  <text class="note" x="40" y="344">invoke_initcalls runs the BSP stream once. bring_online runs the SMP stream on every hart that comes online.</text>
  <text class="note" x="40" y="370">A stage number is the dependency. A call may use what the earlier stages prepared.</text>
</svg>
